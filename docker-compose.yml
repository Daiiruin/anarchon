services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anachron
      POSTGRES_PASSWORD: anachron
      POSTGRES_DB: anachron
    ports:
      - '5432:5432'
    volumes:
      - anachron_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anachron -d anachron']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  anachron_pgdata:
