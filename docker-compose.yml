services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anarchon
      POSTGRES_PASSWORD: anarchon
      POSTGRES_DB: anarchon
    ports:
      - '5432:5432'
    volumes:
      - anarchon_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anarchon -d anarchon']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  anarchon_pgdata:
